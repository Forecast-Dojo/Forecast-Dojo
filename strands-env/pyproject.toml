[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strands-env"
version = "0.1.0+forecastdojo"
description = "Shared agent environment runtime for Forecast-Dojo"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "strands-sglang>=0.4.1",
    "strands-agents[anthropic,openai]>=1.54,<2",
    "httpx",
    "openai",
    "pydantic>=2",
    "typing_extensions",
    "transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["strands_env*"]
